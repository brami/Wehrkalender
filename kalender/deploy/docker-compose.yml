# =====================================================================
#  Kalenderserver FF KRZ – Docker Compose (vollständig, mit Anwendung)
#
#  Ablage auf dem Server: /srv/kalender/docker-compose.yml
#  Anwendung (dieses Repository): /srv/kalender/app
#  Werte wie ${DOMAIN} kommen aus /srv/kalender/.env (von setup-server.sh).
#
#  ACHTUNG: setup-server.sh überschreibt docker-compose.yml und
#  caddy/Caddyfile bei jedem Lauf mit der Platzhalter-Version.
#  Siehe fragen_und_unstimmigkeiten.md, Punkt "setup-server.sh".
# =====================================================================
x-app: &app
  build: ./app
  image: kalender-app:latest
  restart: unless-stopped
  env_file: .env
  environment:
    APP_DOMAIN: ${DOMAIN}
    DB_DRIVER: mysql
    DB_HOST: db
    DB_NAME: kalender
    DB_USER: kalender
  volumes:
    - app-storage:/srv/app/storage
  healthcheck:              # erkennt z. B. fehlerhafte Abhängigkeiten im Image
    test: ["CMD", "php", "-r", "require '/srv/app/vendor/autoload.php';"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 90s
    start_interval: 5s
  depends_on:
    db:
      condition: service_healthy

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:            # nur die Werte, die Caddy braucht – keine Passwörter
      DOMAIN: ${DOMAIN}
      TEST_DOMAIN: ${TEST_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./app/public:/srv/app/public:ro     # statische Dateien (CSS, JS)
      - ./www-test:/srv/www-test:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks: [frontend]
    depends_on: [app]

  app:                      # PHP-FPM: CalDAV, iCal-Feed, Web-Frontend
    <<: *app
    environment:
      APP_DOMAIN: ${DOMAIN}
      DB_DRIVER: mysql
      DB_HOST: db
      DB_NAME: kalender
      DB_USER: kalender
      RUN_MIGRATIONS: "1"
    networks: [frontend, backend]

  worker:                   # gleiches Image, supercronic: import:run, mail:send, monitor:check, cleanup:run
    <<: *app
    command: ["supercronic", "-quiet", "/srv/app/docker/crontab"]
    networks: [backend, egress]   # egress: SMTP-Relay und später HTTPS-API von MP Feuer

  db:
    image: mariadb:11.4     # LTS-Version
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: kalender
      MARIADB_USER: kalender
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
      - ./mariadb/kalender.cnf:/etc/mysql/conf.d/kalender.cnf:ro
    networks: [backend]     # kein Port nach außen, nur internes Netz
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # sftp:                   # nur bei Push per SFTP (Import noch nicht umgesetzt)
  #   image: atmoz/sftp:alpine
  #   restart: unless-stopped
  #   ports: ["2222:22"]
  #   volumes:
  #     - ./sftp/keys/mpexport.pub:/home/mpexport/.ssh/keys/mpexport.pub:ro
  #     - import-inbox:/home/mpexport/inbox
  #   command: mpexport::1001

networks:
  frontend:
  egress:
  backend:
    internal: true          # kein Zugang ins Internet und von außen

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  db-data:
  app-storage:
  # import-inbox:
